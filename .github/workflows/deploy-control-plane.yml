name: Deploy control plane sandbox

on:
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: Skip deploy and dump recent campaign failure diagnostics
        required: false
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-control-plane-sandbox
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose campaign failures
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_only }}
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CONTROL_PLANE_STACK: ${{ vars.AWS_CONTROL_PLANE_STACK }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Collect campaign diagnostics
        run: |
          set -euo pipefail
          mkdir -p /tmp/diagnose
          START_MS=$(( ($(date +%s) - 7200) * 1000 ))

          aws cloudformation describe-stacks \
            --stack-name "${CONTROL_PLANE_STACK}" \
            --query 'Stacks[0].Outputs' \
            --output json > /tmp/diagnose/stack-outputs.json

          aws cloudformation list-stack-resources \
            --stack-name "${CONTROL_PLANE_STACK}" \
            --output json > /tmp/diagnose/stack-resources.json

          API_FN="$(jq -r '
            .StackResourceSummaries[]
            | select(.LogicalResourceId=="ControlPlaneApiFunction")
            | .PhysicalResourceId
          ' /tmp/diagnose/stack-resources.json)"
          STUB_FN="$(jq -r '
            .StackResourceSummaries[]
            | select(.LogicalResourceId=="WorkflowTaskFunction")
            | .PhysicalResourceId
          ' /tmp/diagnose/stack-resources.json)"
          SM_ARN="$(jq -r '
            .[] | select(.OutputKey=="CreateCampaignStateMachineArn") | .OutputValue
          ' /tmp/diagnose/stack-outputs.json)"
          {
            echo "api_fn=${API_FN}"
            echo "stub_fn=${STUB_FN}"
            echo "sm_arn=${SM_ARN}"
          } | tee /tmp/diagnose/resolved.txt

          for group in \
            "/aws/lambda/${CONTROL_PLANE_STACK}-workflow-stub" \
            "/aws/lambda/${CONTROL_PLANE_STACK}-workflow-monitor" \
            "/aws/vendedlogs/states/${CONTROL_PLANE_STACK}-create-campaign" \
            "/aws/lambda/${API_FN}"; do
            safe="$(echo "${group}" | tr '/:' '__')"
            aws logs filter-log-events \
              --log-group-name "${group}" \
              --start-time "${START_MS}" \
              --filter-pattern '?ERROR ?Error ?Exception ?failed ?creativeFamily ?Validation ?dependency' \
              --limit 50 \
              --output json > "/tmp/diagnose/logs-${safe}.json" \
              2> "/tmp/diagnose/logs-${safe}.err" || true
          done

          aws stepfunctions list-executions \
            --state-machine-arn "${SM_ARN}" \
            --status-filter FAILED \
            --max-results 10 \
            --output json > /tmp/diagnose/failed-executions.json \
            2> /tmp/diagnose/failed-executions.err || true

          if [[ -s /tmp/diagnose/failed-executions.json ]]; then
            jq -r '.executions[].executionArn // empty' /tmp/diagnose/failed-executions.json \
              | head -5 \
              | while read -r arn; do
                  safe="$(echo "${arn}" | tr '/:' '__')"
                  aws stepfunctions describe-execution \
                    --execution-arn "${arn}" \
                    --output json > "/tmp/diagnose/execution-${safe}.json" \
                    2> "/tmp/diagnose/execution-${safe}.err" || true
                  aws stepfunctions get-execution-history \
                    --execution-arn "${arn}" \
                    --reverse-order \
                    --max-results 20 \
                    --output json > "/tmp/diagnose/history-${safe}.json" \
                    2> "/tmp/diagnose/history-${safe}.err" || true
                done
          fi

          python3 - <<'PY'
          import json, subprocess, pathlib
          out = pathlib.Path("/tmp/diagnose")
          api = dict(line.split("=", 1) for line in (out / "resolved.txt").read_text().splitlines())["api_fn"]

          def invoke(name, payload, dest):
              pathlib.Path("/tmp/payload.json").write_text(json.dumps(payload))
              result = subprocess.run(
                  [
                      "aws", "lambda", "invoke",
                      "--function-name", name,
                      "--cli-binary-format", "raw-in-base64-out",
                      "--payload", "file:///tmp/payload.json",
                      str(dest),
                  ],
                  capture_output=True,
                  text=True,
              )
              dest.with_suffix(dest.suffix + ".invoke.json").write_text(result.stdout + "\n" + result.stderr)

          base_event = {
              "version": "2.0",
              "routeKey": "POST /campaigns",
              "rawPath": "/campaigns",
              "headers": {
                  "content-type": "application/json",
                  "idempotency-key": "diagnose-invalid-family-0001",
                  "x-correlation-id": "corr-diagnose-0001",
              },
              "requestContext": {
                  "requestId": "diagnose-request-1",
                  "authorizer": {"jwt": {"claims": {"sub": "diagnose_owner_001"}}},
              },
              "isBase64Encoded": False,
          }

          invalid = dict(base_event)
          invalid["body"] = json.dumps({"language": "es", "creativeFamily": "not-a-family"})
          invoke(api, invalid, out / "http-invalid-family.json")

          listed = dict(base_event)
          listed["routeKey"] = "GET /campaigns"
          listed["rawPath"] = "/campaigns"
          listed.pop("body", None)
          invoke(api, listed, out / "http-list-campaigns.json")
          PY

          {
            echo "## Campaign diagnostics"
            echo
            echo '### Resolved'
            echo '```'
            cat /tmp/diagnose/resolved.txt
            echo '```'
            echo
            echo '### Invalid creativeFamily probe'
            echo '```json'
            cat /tmp/diagnose/http-invalid-family.json || true
            echo '```'
            echo
            echo '### Log access errors'
            echo '```'
            head -n 20 /tmp/diagnose/logs-*.err 2>/dev/null || true
            echo '```'
            echo
            echo '### Failed executions access'
            echo '```'
            cat /tmp/diagnose/failed-executions.err 2>/dev/null || true
            echo '```'
            if [[ -f /tmp/diagnose/failed-executions.json ]]; then
              echo
              echo '### Failed executions'
              echo '```json'
              cat /tmp/diagnose/failed-executions.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: campaign-family-diagnostics
          path: /tmp/diagnose

  deploy:
    name: Package and deploy
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diagnose_only) }}
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CONTROL_PLANE_STACK: ${{ vars.AWS_CONTROL_PLANE_STACK }}
      BOOTSTRAP_STACK: ${{ vars.AWS_BOOTSTRAP_STACK }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.14.6"
          enable-cache: true

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve artifact bucket
        id: bootstrap
        run: |
          bucket="$(aws cloudformation describe-stacks \
            --stack-name "${BOOTSTRAP_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue" \
            --output text)"
          if [[ -z "${bucket}" || "${bucket}" == "None" ]]; then
            echo "ArtifactBucketName output missing from ${BOOTSTRAP_STACK}" >&2
            exit 1
          fi
          echo "bucket=${bucket}" >> "$GITHUB_OUTPUT"

      - name: Build control-plane Lambda bundle
        run: |
          rm -rf dist/control-plane-bundle
          mkdir -p dist/control-plane-bundle
          uv pip install --target dist/control-plane-bundle \
            --python-version 3.14 \
            --python-platform aarch64-manylinux2014 \
            --only-binary :all: \
            'pydantic>=2.11,<3' 'boto3>=1.43.51' 'aws-lambda-powertools>=3.20'
          cp -R src/dungeon_agent dist/control-plane-bundle/

      - name: Package and deploy sandbox stack
        run: |
          set -o pipefail
          sam package \
            --template-file infra/control-plane/workflow/template.yaml \
            --s3-bucket "${{ steps.bootstrap.outputs.bucket }}" \
            --s3-prefix artifacts/control-plane \
            --output-template-file dist/control-plane-packaged.yaml \
            --region "${AWS_REGION}"

          aws cloudformation deploy \
            --template-file dist/control-plane-packaged.yaml \
            --s3-bucket "${{ steps.bootstrap.outputs.bucket }}" \
            --s3-prefix artifacts/control-plane/templates \
            --stack-name "${CONTROL_PLANE_STACK}" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset

      - name: Publish stack outputs
        run: |
          {
            echo "## Control plane sandbox"
            echo
            echo "- Stack: \`${CONTROL_PLANE_STACK}\`"
            echo "- Region: \`${AWS_REGION}\`"
            echo
            echo '```json'
            aws cloudformation describe-stacks \
              --stack-name "${CONTROL_PLANE_STACK}" \
              --query 'Stacks[0].Outputs' \
              --output json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
