  WorkflowTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Writes logs for the create-session workflow stub tasks.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteWorkflowTaskLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-workflow-stub:*
                  - !Sub >-
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-turn-worker:*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt SessionTable.Arn
                  - !GetAtt CampaignTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:RenderPrompt
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub >-
                  arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RuntimeConfigParameterName}
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt SpeechCacheBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - portraits/*
                      - portraits/
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:HeadObject
                Resource: !Sub "${SpeechCacheBucket.Arn}/portraits/*"
              - Effect: Allow
                Action:
                  - lambda:ListMicrovmImages
                  - lambda:GetMicrovmImage
                  - lambda:RunMicrovm
                  - lambda:GetMicrovm
                  - lambda:CreateMicrovmAuthToken
                  - lambda:TerminateMicrovm
                  - lambda:PassNetworkConnector
                Resource: "*"
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub >-
                  arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlPlaneWebSocketApi}/prod/*

  WorkflowTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Wave 2 session architects and Lambda MicroVM lifecycle adapter.
      FunctionName: !Sub "${AWS::StackName}-workflow-stub"
      Runtime: python3.14
      Architectures: [arm64]
      CodeUri: ../../../dist/control-plane-bundle
      Handler: dungeon_agent.control_plane.runtime.workflow_handler
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt WorkflowTaskRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SessionTable
          CAMPAIGN_TABLE_NAME: !Ref CampaignTable
          BEDROCK_RUNTIME_CONFIG_PARAMETER: !Ref RuntimeConfigParameterName
          MICROVM_IMAGE_NAME: !Ref MicrovmImageName
          WS_MANAGEMENT_ENDPOINT: !Sub "https://${ControlPlaneWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod"
          SPEECH_CACHE_BUCKET: !Ref SpeechCacheBucket
          BEDROCK_IMAGE_MODEL_ID: stability.stable-image-core-v1:1
          BEDROCK_IMAGE_REGION: us-west-2
          POWERTOOLS_SERVICE_NAME: dungeon-agent-control-plane
          POWERTOOLS_LOG_LEVEL: INFO

  WorkflowTaskLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-workflow-stub"
      RetentionInDays: !Ref LogRetentionDays

  TurnWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Authoritative turn adjudication against the session MicroVM.
      FunctionName: !Sub "${AWS::StackName}-turn-worker"
      Runtime: python3.14
      Architectures: [arm64]
      CodeUri: ../../../dist/control-plane-bundle
      Handler: dungeon_agent.control_plane.runtime.turn_handler
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt WorkflowTaskRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SessionTable
          CAMPAIGN_TABLE_NAME: !Ref CampaignTable
          BEDROCK_RUNTIME_CONFIG_PARAMETER: !Ref RuntimeConfigParameterName
          MICROVM_IMAGE_NAME: !Ref MicrovmImageName
          WS_MANAGEMENT_ENDPOINT: !Sub "https://${ControlPlaneWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod"
          POWERTOOLS_SERVICE_NAME: dungeon-agent-control-plane
          POWERTOOLS_LOG_LEVEL: INFO

  TurnWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-turn-worker"
      RetentionInDays: !Ref LogRetentionDays

  CreateSessionStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Invokes only the create-session workflow task stub and publishes telemetry.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeWorkflowTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WorkflowTaskFunction.Arn
        - PolicyName: DeliverWorkflowLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
        - PolicyName: PublishWorkflowTraces
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

  CreateSessionWorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${AWS::StackName}-create-session"
      RetentionInDays: !Ref LogRetentionDays

  CreateSessionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - CreateSessionWorkflowLogGroup
      - WorkflowTaskLogGroup
    Properties:
      StateMachineName: !Sub "${AWS::StackName}-create-session"
      StateMachineType: STANDARD
      RoleArn: !GetAtt CreateSessionStateMachineRole.Arn
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt CreateSessionWorkflowLogGroup.Arn
        IncludeExecutionData: false
        Level: ALL
      TracingConfiguration:
        Enabled: true
      Definition:
        Comment: Creates a session through replaceable, independently observable phases.
        StartAt: ValidateSession
        TimeoutSeconds: 900
        States:
          ValidateSession:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 30
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: ValidateSession
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: CreateSessionRecord

          CreateSessionRecord:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 30
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: CreateSessionRecord
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: EmitStartingMicrovm

          EmitStartingMicrovm:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 30
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: EmitStartingMicrovm
                phase: starting_microvm
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: LaunchMicrovm

          LaunchMicrovm:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 120
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: LaunchMicrovm
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: WaitForMicrovm

          WaitForMicrovm:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 300
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: WaitForMicrovm
                phase: waiting_for_microvm
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: EmitInitializingGame

          EmitInitializingGame:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 30
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: EmitInitializingGame
                phase: initializing_game
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: ForkCampaignIntoSession

          ForkCampaignIntoSession:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 60
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: ForkCampaignIntoSession
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: InitializeMicrovmGame

          InitializeMicrovmGame:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 120
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: InitializeMicrovmGame
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: MarkSessionReady

          MarkSessionReady:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 30
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: MarkSessionReady
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: EmitSessionReady

          EmitSessionReady:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 30
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: EmitSessionReady
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals:
                  - ValidationError
                  - AuthorizationError
                ResultPath: "$.failure"
                Next: MarkSessionFailed
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.failure"
                Next: MarkSessionFailed
            Next: SessionCreated

          SessionCreated:
            Type: Succeed

          MarkSessionFailed:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 30
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: MarkSessionFailed
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: "$.failureHandlerFailure"
                Next: WorkflowFailureHandlerFailed
            Next: EmitSessionCreationFailed

          EmitSessionCreationFailed:
            Type: Task
            Resource: !Sub "arn:${AWS::Partition}:states:::lambda:invoke"
            TimeoutSeconds: 30
            Parameters:
              FunctionName: !GetAtt WorkflowTaskFunction.Arn
              Payload:
                operation: EmitSessionCreationFailed
                state.$: "$"
                workflowExecutionArn.$: "$$.Execution.Id"
                stateEnteredAt.$: "$$.State.EnteredTime"
                retryCount.$: "$$.State.RetryCount"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - RetriableDependencyError
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
                MaxDelaySeconds: 30
                JitterStrategy: FULL
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: "$.failureHandlerFailure"
                Next: WorkflowFailureHandlerFailed
            Next: SessionCreationFailed

          SessionCreationFailed:
            Type: Fail
            Error: SessionCreationFailed
            Cause: The workflow marked the session failed and emitted a durable-event stub.

          WorkflowFailureHandlerFailed:
            Type: Fail
            Error: WorkflowFailureHandlerFailed
            Cause: The terminal failure handler could not record the workflow failure.

